:root{
  color-scheme:light;
  --bg:#F4F1EA; --card:#FFFDF8; --ink:#2B1F19; --mute:#7A6A5E; --line:#D9D0C2;
  --wall:#43281F; --grid:rgba(67,40,31,.20); --hatch:rgba(67,40,31,.30); --shade:rgba(67,40,31,.20);
  --hl:#F2B705; --bad:#C8281E; --ok:#1E7A46; --glass:#5BBFCB; --jamb:#E8792B; --sill:#E9DBB7; --cream:#F6ECD6;
  --f0:#BCD2E4; --f1:#BDBBB8; --f2:#E6D08E; --f3:#B79675; --f4:#DCBDB4; --f5:#BCCBAD;
  --desk:#DDD6C8; --well:#E6DFD1;
  --font:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font:400 15px/18px var(--font);display:flex;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #1565C0;outline-offset:-3px}
.screen{position:relative;width:100%;max-width:430px;height:100%;max-height:932px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.ghead{height:44px;flex:none;display:flex;align-items:center}
.ghead button{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;flex:none}
.ghead .ttl{flex:1;min-width:0;font:500 15px/18px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghead .ttl small{color:var(--mute);font-weight:400;font-size:13px}
.ghead .tm{font:500 14px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--mute);padding:0 4px}
.fwrap{flex:none;display:flex;justify-content:center;padding:var(--fpad,0px) 0;background:var(--well)}
.field{position:relative;width:calc(var(--cell)*var(--n) + 6px);height:calc(var(--cell)*var(--n) + 6px);border:3px solid var(--wall);border-radius:2px;background:var(--wall)}
.layer{position:absolute;inset:0;pointer-events:none}
.at{position:absolute;width:var(--cell);height:var(--cell);left:calc(var(--cell)*var(--x));top:calc(var(--cell)*var(--y))}
.floor{position:absolute;left:calc(var(--cell)*var(--x));top:calc(var(--cell)*var(--y));width:calc(var(--cell)*var(--w));height:calc(var(--cell)*var(--h))}
.floor.f0{background:var(--f0)}.floor.f1{background:var(--f1)}.floor.f2{background:var(--f2)}.floor.f3{background:var(--f3)}.floor.f4{background:var(--f4)}.floor.f5{background:var(--f5)}
.lgrid{background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);background-size:var(--cell) var(--cell)}
.hatch{background:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 6px),rgba(67,40,31,.07)}
.item{position:absolute;max-width:none;transition:transform .12s}
.lobj .item{filter:drop-shadow(0 1.5px 1.5px rgba(40,20,10,.38))}
.at.occ .item{transform:translateY(calc(var(--cell)*var(--idy)))}
svg.walls{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
svg.walls .w{stroke:var(--wall);stroke-width:3;stroke-linecap:square;vector-effect:non-scaling-stroke}
svg.walls .s{stroke:var(--sill);stroke-width:2.4;vector-effect:non-scaling-stroke}
svg.walls .so{stroke:var(--wall);stroke-width:3.6;vector-effect:non-scaling-stroke;opacity:.55}
svg.walls .j{fill:var(--jamb);stroke:var(--wall);stroke-width:1;vector-effect:non-scaling-stroke}
.shade{background:var(--shade);opacity:0;transition:opacity .25s}
.shade.on{opacity:1}
.hlc{box-shadow:inset 0 0 0 3px var(--hl);background:rgba(242,183,5,.22)}
.hlc.hint{background:rgba(242,183,5,.45)}
.eye .lmark{display:none}
.x{position:absolute;inset:27%}
.x svg{width:100%;height:100%;overflow:visible}
.x .o{stroke:var(--cream);stroke-width:4.3;stroke-linecap:round}
.x .i{stroke:var(--wall);stroke-width:2.27;stroke-linecap:round}
.nts{position:absolute;left:1px;right:1px;top:11px;bottom:1px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr)}
.nts i{font:700 calc(var(--cell)*.225)/1 var(--font);font-style:normal;display:grid;place-items:center;color:var(--pc);margin:.5px 1.5px;border-radius:3px}
.nts i:not(:empty){background:rgba(255,253,248,.9)}
.nts i.cur{background:var(--pf);color:var(--pl)}
.tok{position:absolute;inset:0;margin:auto;width:calc(var(--cell)*var(--ts));height:calc(var(--cell)*var(--ts));border-radius:50%;
  transform:translateY(calc(var(--cell)*var(--tdy,0)))}
.tok img{display:block;width:100%;height:100%;filter:drop-shadow(0 1.5px 2px rgba(40,20,10,.45))}
.tok.sel{box-shadow:0 0 0 4px var(--hl),0 0 0 5.5px var(--wall)}
.tok.bad{box-shadow:0 0 0 3px var(--bad)}
.tok.lift{opacity:.25}
@keyframes pop{from{transform:translateY(calc(var(--cell)*var(--tdy,0))) scale(.6)}}
@media (prefers-reduced-motion:no-preference){ .tok.pop{animation:pop .14s ease-out} .hlc{animation:pulse .9s ease-in-out 2} .tools button.nudge{animation:nudge 1.4s ease-in-out 1}
  .tok.flinch{animation:flinch .5s ease-in-out} .clashln{animation:clashln 1s ease-out both} .acc.in{animation:accin .28s ease-out} }
@keyframes flinch{0%,100%{transform:translateY(calc(var(--cell)*var(--tdy,0)))}
  25%,65%{transform:translate(calc(var(--cell)*var(--fx,0)*.16),calc(var(--cell)*(var(--tdy,0) + var(--fy,0)*.16)))}
  45%{transform:translate(calc(var(--cell)*var(--fx,0)*.04),calc(var(--cell)*(var(--tdy,0) + var(--fy,0)*.04)))}}
@keyframes clashln{0%{opacity:0}15%,60%{opacity:1}100%{opacity:0}}
@keyframes accin{from{opacity:0}}
.clashln{position:absolute;background:rgba(200,40,30,.24);box-shadow:inset 0 0 0 2px var(--bad)}
@keyframes pulse{50%{opacity:.4}}
@keyframes nudge{30%{background:#FBE9A6;border-color:var(--hl)}}
.rlab{position:absolute;left:calc(var(--cell)*var(--x) + 3px);top:calc(var(--cell)*var(--y) - 1px);height:13px;padding:0 4px;border-radius:0 0 3px 3px;background:var(--wall);color:var(--cream);
  font:700 9px/13px var(--font);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.win{position:absolute;background:var(--glass)}
.win.h{width:calc(var(--cell)*.6);height:3px;left:calc(var(--cell)*(var(--x) + .2))}
.win.v{height:calc(var(--cell)*.6);width:3px;top:calc(var(--cell)*(var(--y) + .2))}
.win.N{top:-3px}.win.S{bottom:-3px}.win.W{left:-3px}.win.E{right:-3px}
.input{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),var(--cell));grid-auto-rows:var(--cell);touch-action:none}
.input button{border:0;padding:0;margin:0;background:none;touch-action:none}
.dragghost{position:fixed;z-index:50;pointer-events:none;border-radius:50%;transform:translate(-50%,-62%)}
.dragghost img{display:block;width:100%;height:100%;filter:drop-shadow(0 5px 6px rgba(40,20,10,.45))}
.cards{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 4px;margin-top:6px;touch-action:none}
.cards.scroll{overflow-y:auto;flex:0 1 auto;touch-action:pan-y}
.card{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;min-height:44px;min-width:0;text-align:left;font:400 15px/18px var(--font);overflow-wrap:anywhere}
.card.sel{border-color:var(--pc);background:var(--pf);color:var(--pl);box-shadow:0 0 0 2px var(--pc)}
.card.sel .nm{color:var(--pl)}
.card.sel .ct{border-radius:50%;box-shadow:0 0 0 1.5px var(--pl)}
.card.sel .chk{color:var(--pl);opacity:.6}
.card.sel.done .chk{color:var(--pl);opacity:1}
.card.sel small{color:var(--pl)!important;opacity:.8}
.card.hint{box-shadow:0 0 0 3px var(--hl)}
.card.broken{box-shadow:0 0 0 3px var(--bad)}
.card.done .say{opacity:.45}
.ct{display:inline-block;width:20px;height:20px;margin:-1px 4px -1px 0;vertical-align:top}
.card.set .ct{opacity:.4}
.cards.all .card.set .ct{opacity:1}
.nm{font-weight:700;color:var(--pc)}
.card.sel .term{background:color-mix(in srgb,var(--pl) 24%,transparent);border-radius:4px;padding:1px 3px;margin:0 -3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.chk{float:right;position:relative;width:20px;height:18px;margin-left:4px;border:0;background:none;padding:0;color:var(--line);display:grid;place-items:center}
.chk::before{content:"";position:absolute;inset:-9px -9px -9px -7px}
.chk svg{width:16px;height:16px}
.card.done .chk{color:var(--ok)}
.card.vcard{display:flex;align-items:center;font-weight:500}
.card.vcard small{color:var(--mute);font:400 13px/1 var(--font);margin-left:6px}
.acc{border:1.5px solid var(--line);border-radius:8px;min-height:44px;padding:4px 8px;font:400 13px/17px var(--font);background:#EAE4D8;color:var(--mute)}
.acc.ask{font:500 15px/18px var(--font);border-color:var(--bad);background:var(--card);color:var(--bad)}
.acc.ask.on{background:var(--bad);color:#fff}
.acc.clash{font:500 15px/18px var(--font);border-color:var(--bad);background:var(--bad);color:#fff}
.acc.fin{font:500 15px/18px var(--font);background:var(--card);color:var(--ink)}
.dock{position:relative;flex:1;min-height:40px}
.toast{position:absolute;z-index:8;left:5px;right:5px;bottom:1px;min-height:38px;background:var(--wall);color:var(--cream);border-radius:10px;padding:5px 12px;font:400 14px/18px var(--font);display:flex;gap:10px;align-items:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.toast svg{flex:none;width:46px;height:46px}
.toast b{font-weight:700}
.toast span{flex:1;min-width:0}
.toast button{flex:none;border:0;border-radius:7px;min-height:32px;padding:0 10px;background:var(--hl);color:var(--ink);font:500 13px/1 var(--font)}
.tools{flex:none;height:54px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:5px 4px}
.tools button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:500 10.5px/1 var(--font);padding:0}
